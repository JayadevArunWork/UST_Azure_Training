apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fitness-tracker-hpa
  namespace: fitness-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fitness-tracker-app

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50