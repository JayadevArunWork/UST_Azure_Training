name: Backend

on:
  push:
    paths: ["apps/**", "packages/python/**", "database/**", "tests/**", "pyproject.toml"]
  pull_request:
    paths: ["apps/**", "packages/python/**", "database/**", "tests/**", "pyproject.toml"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SENTINEL_ENTRA_AUDIENCE: api://00000000-0000-0000-0000-000000000000
      SENTINEL_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
      SENTINEL_TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: alembic -c database/alembic.ini upgrade head
      - run: ruff check apps packages/python tests
      - run: python -m compileall -q apps packages/python
      - run: pytest --cov=sentinel_common --cov-report=term-missing
