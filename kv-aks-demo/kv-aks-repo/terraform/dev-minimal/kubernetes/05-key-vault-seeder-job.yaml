apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-key-vault-seeder
  namespace: sentinel-app
  labels:
    app.kubernetes.io/name: sentinel-key-vault-seeder
    app.kubernetes.io/part-of: sentinel
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-key-vault-seeder
        app.kubernetes.io/part-of: sentinel
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: identity-service
      restartPolicy: Never
      containers:
        - name: seeder
          image: mcr.microsoft.com/azure-cli:2.75.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: sentinel-seed-values
          command:
            - /bin/sh
            - -ec
            - |
              az login \
                --service-principal \
                --username "$AZURE_CLIENT_ID" \
                --tenant "$AZURE_TENANT_ID" \
                --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                --allow-no-subscriptions \
                --output none

              set_secret() {
                value="$(printf '%s' "$2" | base64 -d)"
                az keyvault secret set \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$1" \
                  --value "$value" \
                  --output none
              }

              set_secret postgres-runtime-url "$DATABASE_URL_B64"
              set_secret internal-api-token "$INTERNAL_API_TOKEN_B64"
              set_secret identity-microsoft-client-secret "$MICROSOFT_CLIENT_SECRET_B64"
              set_secret identity-session-signing-key "$SESSION_SIGNING_KEY_B64"
              set_secret identity-token-encryption-key "$TOKEN_ENCRYPTION_KEY_B64"

              echo "Required Key Vault secrets were written."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
