apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-gateway-nginx
  namespace: sentinel-app
data:
  nginx.conf: |
    events {}

    http {
      server_tokens off;
      sub_filter_types application/javascript text/javascript text/css application/json;

      upstream web { server web.sentinel-app.svc.cluster.local:80; }
      upstream identity { server identity-service.sentinel-app.svc.cluster.local:80; }

      server {
        listen 8080;

        location ^~ /.well-known/acme-challenge/ {
          root /var/www/certbot;
          default_type text/plain;
          try_files $uri =404;
        }

        location / {
          return 308 https://$host$request_uri;
        }
      }

      server {
        listen 8443 ssl;
        client_max_body_size 2m;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Correlation-ID $request_id;

        location = /api/v1/auth/health/live { proxy_pass http://identity/health/live; }
        location = /api/v1/auth/health/ready { proxy_pass http://identity/health/ready; }
        location /api/v1/auth/ { proxy_pass http://identity; }
        location /auth/ { proxy_pass http://identity; }
        location /api/v1/tenants/ { proxy_pass http://identity; }
        location / {
          proxy_set_header Accept-Encoding "";
          sub_filter_once off;
          sub_filter 'https://sentinel.vaultrix.in' 'https://REPLACE_ME_DOMAIN';
          proxy_pass http://web;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-gateway
  namespace: sentinel-app
  labels:
    app.kubernetes.io/name: sentinel-gateway
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-gateway
        app.kubernetes.io/part-of: sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: acme-webroot
              mountPath: /var/www/certbot
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: nginx-config
          configMap:
            name: sentinel-gateway-nginx
        - name: tls
          secret:
            secretName: sentinel-gateway-tls
        - name: acme-webroot
          persistentVolumeClaim:
            claimName: sentinel-acme-webroot
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-gateway
  namespace: sentinel-app
  annotations:
    service.beta.kubernetes.io/azure-pip-name: REPLACE_ME_GATEWAY_PUBLIC_IP_NAME
    service.beta.kubernetes.io/azure-load-balancer-resource-group: REPLACE_ME_RESOURCE_GROUP
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: sentinel-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-acme-webroot
  namespace: sentinel-app
  labels:
    app.kubernetes.io/name: sentinel-gateway
    app.kubernetes.io/part-of: sentinel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
