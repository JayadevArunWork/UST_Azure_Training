events {}

http {
  server_tokens off;

  upstream web { server web:3000; }
  upstream identity { server identity-service:8000; }
  upstream inventory { server inventory-service:8000; }
  upstream relationships { server relationship-service:8000; }
  upstream intelligence { server change-intelligence-service:8000; }
  upstream operations { server operations-service:8000; }
  upstream audit { server audit-service:8000; }

  server {
    listen 8080;
    client_max_body_size 2m;

    location /api/v1/auth/ { proxy_pass http://identity; include /etc/nginx/proxy_params; }
    location /auth/ { proxy_pass http://identity; include /etc/nginx/proxy_params; }
    location /api/v1/tenants/ { proxy_pass http://identity; include /etc/nginx/proxy_params; }
    location /api/v1/inventory/ { proxy_pass http://inventory; include /etc/nginx/proxy_params; }
    location /api/v1/relationships { proxy_pass http://relationships; include /etc/nginx/proxy_params; }
    location /api/v1/analysis/ { proxy_pass http://intelligence; include /etc/nginx/proxy_params; }
    location /api/v1/operations { proxy_pass http://operations; include /etc/nginx/proxy_params; }
    location /api/v1/audit/ { proxy_pass http://audit; include /etc/nginx/proxy_params; }
    location / { proxy_pass http://web; include /etc/nginx/proxy_params; }
  }
}
