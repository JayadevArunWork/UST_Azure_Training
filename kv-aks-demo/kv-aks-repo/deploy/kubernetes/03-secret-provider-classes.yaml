apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: identity-service-secrets
  namespace: sentinel-app
spec:
  provider: azure
  secretObjects:
    - secretName: identity-service-runtime
      type: Opaque
      data:
        - objectName: postgres-runtime-url
          key: database-url
        - objectName: internal-api-token
          key: internal-api-token
        - objectName: identity-microsoft-client-secret
          key: microsoft-client-secret
        - objectName: identity-session-signing-key
          key: session-signing-key
        - objectName: identity-token-encryption-key
          key: token-encryption-key
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: 98e5b955-8bc7-4e2a-86b1-eb770c35de38
    keyvaultName: RG-1-KV
    tenantId: 83474cb5-f1fa-4d06-906c-e5dad12ce3b9
    objects: |
      array:
        - |
          objectName: postgres-runtime-url
          objectType: secret
        - |
          objectName: internal-api-token
          objectType: secret
        - |
          objectName: identity-microsoft-client-secret
          objectType: secret
        - |
          objectName: identity-session-signing-key
          objectType: secret
        - |
          objectName: identity-token-encryption-key
          objectType: secret
---
